# The Xcode project, generated by XcodeGen on a Mac (`xcodegen generate` in this folder). Never edit the .xcodeproj:
# it is not in git. Everything the project needs is written here.
name: BoringTravel
options:
  bundleIdPrefix: com.justdataplease
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    # The Android app's versionName (android-boringtravel/app/build.gradle.kts), which Me › Version shows on both phones
    # (the build writes it into the app: AppVersion); raise it with Android's (VersionTest checks the two agree). CI
    # passes the build number (CURRENT_PROJECT_VERSION) for TestFlight.
    MARKETING_VERSION: "1.22.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # The App Group the app and its widgets share (the widgets read the snapshot the app writes there). It has to be
    # registered in the owner's Apple Developer account for a signed build; an unsigned build (the Simulator's CI)
    # carries no entitlements, and then nothing is written and the widgets show their empty look. Since round 27 the
    # share extension (BoringTravelShare) writes what other apps share into the same group's Shares/ folder.
    APP_GROUP: group.com.justdataplease.boringtravel
    # Round 24: a community post's link (https://justdataplease.com/apps/boringtravel/post/#<id>, Android's
    # CommunityLinks) opens the post in the app (a universal link). iOS checks the site's
    # /.well-known/apple-app-site-association for this app's id first: until the owner puts it on the site, the link
    # opens the website, whose page can send the app's own link (boringtravel://post/#<id>, the URL type below). The
    # App ID needs the Associated Domains capability in the owner's Apple Developer account for a signed build; an
    # unsigned build (the Simulator's CI) carries no entitlements. Since round 26 the same domain carries Travel together's
    # join links (https://justdataplease.com/apps/boringtravel/join/#…): the site's file names /apps/boringtravel/join* too.
    ASSOCIATED_DOMAINS: applinks:justdataplease.com
# The maps: MapLibre Native for iOS, the same map library as the Android app (OpenFreeMap's tiles, no key). Its Swift
# package is MapLibre's own distribution repository; 7.0.0 (28 Oct 2026) needs iOS 15.5 or later.
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 7.0.0
targets:
  BoringTravel:
    type: application
    platform: iOS
    sources:
      - path: BoringTravel
      # A small widget's buttons (iOS 17): the intent runs in the app, so it is in both targets.
      - path: BoringTravelWidget/OpenActionIntent.swift
      # The recording route's Live Activity: its attributes (the app starts it, the extension draws it) and its Stop
      # (an intent that runs in the app), so in both targets too.
      - path: BoringTravelWidget/RecordingAttributes.swift
    dependencies:
      - package: MapLibre
        product: MapLibre
      # The home-screen widgets, embedded in the app.
      - target: BoringTravelWidget
      # Round 27: BoringTravel in other apps' share sheets, embedded in the app.
      - target: BoringTravelShare
    info:
      path: BoringTravel/Info.plist
      properties:
        CFBundleDisplayName: BoringTravel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # iOS's own sheets (share, print, the pickers, permission questions, alerts) in the phone's language, as Android's
        # system UI follows the phone's: the app declares only English, so without this iOS would draw them in English
        # too. The app's own words stay English, as on Android.
        CFBundleAllowMixedLocalizations: true
        # As Android 12's splash: the window's colour (Postcard Pop's cream, Android's window_light) with the app's icon in
        # a 160 point circle in the middle (LaunchIcon: the icon's artwork, circle-masked as Android masks an adaptive icon).
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchIcon
        # As Android's activity (no screenOrientation in its manifest): upright and either way sideways, not upside down
        # (Android phones don't turn there either). The screens are Android's Compose, laid out at the width they get.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Compose draws at the screen's full refresh rate.
        CADisableMinimumFrameDurationOnPhone: true
        # Only HTTPS and Apple's own encryption: no export paperwork.
        ITSAppUsesNonExemptEncryption: false
        # A journal note's "Take a photo" and "Record a video" open the camera (Android hands both to its camera app,
        # which asks nothing of the app). The photo library needs no permission: its picker hands over copies.
        NSCameraUsageDescription: Take a photo or record a video for a journal note.
        # Dictation (the editor's mic) listens only while the mic button is on, as on Android; the speech service turns
        # the words into the note's text. Since round 19 the trip video's voice lines too: the microphone is asked for
        # only when the first line starts recording (Audio's Record, the tracks' "+ Record"), as Android asks.
        NSMicrophoneUsageDescription: Record the sound of a video you take, record a voice line for your trip video, and hear you while the mic button is on to write what you say into a note.
        NSSpeechRecognitionUsageDescription: Turn what you say into the words of a journal note while the mic button is on.
        # "Use my location" in a plan item's place and a note's place and the daily check-in's "Use current location"
        # ask on that tap only; route tracking asks in Me › Route tracking or a trip map's Route tracking, after its own
        # word, once a level is picked (Off by default: nothing is asked at the first start).
        NSLocationWhenInUseUsageDescription: Put where you are as the place of a plan item or a journal note, find today's place for a check-in, and record your route during a trip when Route tracking is on.
        # Always: the app never asks for it (IosTrackingPlan.ASK_ALWAYS is off, as Android's background recording is),
        # but the call is compiled in behind that switch, and App Store Connect's check reads the binary, not the
        # switch: a binary that names requestAlwaysAuthorization without this key is reported as missing a purpose
        # string. Kept, so the upload passes and the switch can be turned on without touching the project. The text is
        # shown only by iOS's own Always question, which the app doesn't ask; Always picked by hand in Settings is taken
        # as While Using.
        NSLocationAlwaysAndWhenInUseUsageDescription: Keep recording your trip route for your map, journal and clips when BoringTravel is closed, only between a trip's dates. The points stay on this phone.
        # Route tracking records in the background after the app was opened during a trip (the blue location sign
        # shows: While Using is enough for it, as Android's location service needs the app on screen to start), and the
        # nightly check (BGTaskScheduler) starts or stops it for the new day and turns points into stops.
        UIBackgroundModes:
          - location
          - fetch
          - processing
        # While the route records, a Live Activity on the Lock Screen and in the Dynamic Island with Android's words
        # and Stop ("Recording your route · Balanced"; Android: its ongoing notification). Started only while the app
        # is on screen and only with notifications allowed, as Android shows its notification.
        NSSupportsLiveActivities: true
        # Since the second parity round also iOS 26's continued processing tasks (BGContinuedProcessingTask): the trip
        # video's export and Copy from a link, started by the traveller's tap, go on away from the screen with the
        # system's own progress (IosBackground.kt), as Android's work goes on.
        BGTaskSchedulerPermittedIdentifiers:
          - com.justdataplease.boringtravel.tracking.night
          - com.justdataplease.boringtravel.tracking.check
          - com.justdataplease.boringtravel.continued.export
          - com.justdataplease.boringtravel.continued.copy
          # Round 23: the daily Drive backup (Android's WorkManager job "Back up every day", around 22:00, network
          # needed): a processing task asked for after each backup or each change of the switches (IosBackupTask in
          # IosGoogle.kt). iOS picks the moment; opening the app after 22:00 runs a missed one too.
          - com.justdataplease.boringtravel.backup.daily
          # Round 26, Travel together: the shared trips' catch-up every 3 h and the sends a closed app left waiting (Android's
          # WorkManager jobs "together-sync" and "together-send-<trip>"): an app refresh task (IosTogetherRuns in
          # IosTogether.kt), best effort, with the `fetch` mode above.
          - com.justdataplease.boringtravel.together.sync
        # Round 23, Google sign-in and Drive: Google's page opens in ASWebAuthenticationSession, which catches the
        # answer to the iOS client's own address (com.googleusercontent.apps.<id>:/oauth2redirect) itself, so no URL
        # type is added for it. Sign in with Apple uses AuthenticationServices' own sheet (entitlement below).
        # A trip's ⋮ › Calendar: the trip and its plan items into a calendar the traveller picks, kept up to date, and
        # events read to import into the plan (Android asks for the same in the same place). Asked only there; the app
        # only changes events it added. iOS 17 and later read the first key, iOS 16 the second.
        NSCalendarsFullAccessUsageDescription: Add your trip and its plan to a calendar you pick and keep it up to date, and list the events in the trip's dates to import. BoringTravel only changes events it added.
        NSCalendarsUsageDescription: Add your trip and its plan to a calendar you pick and keep it up to date, and list the events in the trip's dates to import. BoringTravel only changes events it added.
        # Your world's Save image: the share card into Photos (add only; the app never reads the library). Since round 20
        # also the trip video's Save to phone, asked at that moment with add-only access.
        NSPhotoLibraryAddUsageDescription: Save your world card and your trip videos to your photos.
        # The trip video's Export sheet (round 20) shows TikTok always and Instagram and WhatsApp when they are on the
        # phone, as Android does: canOpenURL may only ask about the addresses listed here. Nothing else is looked up.
        LSApplicationQueriesSchemes:
          - tiktok
          - snssdk1233
          - instagram
          - whatsapp
        # The widgets' buttons and the quick actions open the app at their action (boringtravel://write, camera, voice,
        # today, new_trip). Since round 24 also a community post (boringtravel://post/#<id>), the website's way into the
        # app while the post links aren't universal links yet; since round 26 a shared trip's join link
        # (boringtravel://join#…, Android's own scheme link), everything after "#" handed to Kotlin whole.
        CFBundleURLTypes:
          - CFBundleURLName: com.justdataplease.boringtravel
            CFBundleURLSchemes:
              - boringtravel
        # Long press on the app's icon (Android's launcher shortcuts): Write, Take a photo, Voice note, New trip.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: write
            UIApplicationShortcutItemTitle: Write
            UIApplicationShortcutItemIconSymbolName: square.and.pencil
          - UIApplicationShortcutItemType: camera
            UIApplicationShortcutItemTitle: Take a photo
            UIApplicationShortcutItemIconSymbolName: camera
          - UIApplicationShortcutItemType: voice
            UIApplicationShortcutItemTitle: Voice note
            UIApplicationShortcutItemIconSymbolName: mic
          - UIApplicationShortcutItemType: new_trip
            UIApplicationShortcutItemTitle: New trip
            UIApplicationShortcutItemIconSymbolName: airplane
        # Where WidgetBridge.swift writes the widgets' snapshot.
        BoringTravelAppGroup: $(APP_GROUP)
    entitlements:
      path: BoringTravel/BoringTravel.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP)
        # Round 23: Sign in with Apple beside Google on Welcome's account step and Me's Account card (App Review 4.8).
        # The App ID needs the Sign in with Apple capability in the owner's Apple Developer account for a signed
        # build; the button shows only when the build value apple.signIn is on (and Firebase's ids are set), so a
        # build without it never asks Apple. The Simulator's unsigned CI build carries no entitlements.
        com.apple.developer.applesignin:
          - Default
        # Round 24: the community's post links as universal links (the build setting ASSOCIATED_DOMAINS above).
        com.apple.developer.associated-domains:
          - $(ASSOCIATED_DOMAINS)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justdataplease.boringtravel
        PRODUCT_NAME: BoringTravel
        # iPhone only.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The screens and the engine: the Kotlin framework Gradle builds in the script below.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        # The Kotlin framework is static, so the system frameworks route tracking, its notes and the nightly run use
        # from Kotlin are linked here.
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - BoringTravelApp
          - -framework
          - CoreLocation
          - -framework
          - UserNotifications
          - -framework
          - BackgroundTasks
          # The trip video's editor (round 19): the bundled music and voice lines (AVFAudio's AVAudioPlayer,
          # AVAudioRecorder, AVAudioSession), a phone video's length and pictures (AVFoundation's AVURLAsset and
          # AVAssetImageGenerator, CoreMedia's times), called from Kotlin.
          - -framework
          - AVFoundation
          - -framework
          - AVFAudio
          - -framework
          - CoreMedia
          # The trip video's export (round 20): the writer's pixel buffers (CoreVideo) and Save to phone into Photos
          # (Photos, add-only; Your world's card has used it since round 11).
          - -framework
          - CoreVideo
          - -framework
          - Photos
          # The second parity round: every picture's format and tags (ImageIO, UniformTypeIdentifiers), the video
          # player's layer (QuartzCore's CATransaction with AVFoundation's AVPlayerLayer).
          - -framework
          - ImageIO
          - -framework
          - UniformTypeIdentifiers
          - -framework
          - QuartzCore
          # Round 23: Google's sign-in page (ASWebAuthenticationSession), Sign in with Apple (ASAuthorizationController)
          # and its button (ASAuthorizationAppleIDButton), called from Kotlin.
          - -framework
          - AuthenticationServices
        # OpenActionIntent.swift hands the action to Kotlin only in the app (the widget doesn't link Kotlin).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) BORINGTRAVEL_APP
        # The script runs Gradle, which reads and writes outside Xcode's sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: false
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Build the Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          sh ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
  # The home-screen widgets "Today", "Quick bar" and "Quick bar, small" (BoringTravelWidget.swift): SwiftUI only,
  # without the app's Kotlin; they read the snapshot the app writes into the App Group's folder.
  BoringTravelWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BoringTravelWidget
      # Roboto, Android's system face, which its widgets' words are in (Glance's text has no family): Google's files the
      # Compose screens read too, kept once in git (composeApp's resources, their Apache 2.0 licence beside them).
      - path: ../composeApp/src/commonMain/composeResources/files/roboto/Roboto-Regular.ttf
        buildPhase: resources
      - path: ../composeApp/src/commonMain/composeResources/files/roboto/Roboto-Medium.ttf
        buildPhase: resources
      - path: ../composeApp/src/commonMain/composeResources/files/roboto/Roboto-Bold.ttf
        buildPhase: resources
    info:
      path: BoringTravelWidget/Info.plist
      properties:
        CFBundleDisplayName: BoringTravel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The system's words around a widget (the gallery, Edit Widget) in the phone's language, as the app's.
        CFBundleAllowMixedLocalizations: true
        UIAppFonts:
          - Roboto-Regular.ttf
          - Roboto-Medium.ttf
          - Roboto-Bold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        BoringTravelAppGroup: $(APP_GROUP)
    entitlements:
      path: BoringTravelWidget/BoringTravelWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justdataplease.boringtravel.widget
        PRODUCT_NAME: BoringTravelWidget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
  # Round 27: BoringTravel in other apps' share sheets (Android: MainActivity's ACTION_SEND filters for text and 1–10
  # pictures). Apple gives a share extension no way to open its app, and the app's Kotlin screens don't run in an
  # extension, so ShareViewController.swift (SwiftUI only, no Kotlin) writes what was shared into the App Group's folder
  # (Shares/) and says "Sent to BoringTravel. Open the app to finish."; the app takes it when it is next on screen and
  # opens Android's own sheets (composeApp ios/ShareIn.kt). It uses no required-reason API (no UserDefaults, no file
  # dates), so it needs no privacy manifest of its own.
  BoringTravelShare:
    type: app-extension
    platform: iOS
    sources:
      - path: BoringTravelShare
      # Roboto, as the widgets have it (composeApp's resources, kept once in git).
      - path: ../composeApp/src/commonMain/composeResources/files/roboto/Roboto-Regular.ttf
        buildPhase: resources
      - path: ../composeApp/src/commonMain/composeResources/files/roboto/Roboto-Medium.ttf
        buildPhase: resources
    info:
      path: BoringTravelShare/Info.plist
      properties:
        # The name the share sheet shows under the app's icon (Android's chooser shows "BoringTravel" for text and "Plan
        # from picture" for pictures: one extension has one name on iPhone).
        CFBundleDisplayName: BoringTravel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleAllowMixedLocalizations: true
        UIAppFonts:
          - Roboto-Regular.ttf
          - Roboto-Medium.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # What the share sheet offers BoringTravel for: text (Android's text/plain), one web link (a browser's page),
            # 1–10 pictures (Android's image/*, at most PictureReading.MAX_PICTURES) and one file (a .txt for the
            # planner; the dictionary's file key names no type, so the app says when a file isn't plain text).
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 1
        BoringTravelAppGroup: $(APP_GROUP)
    entitlements:
      path: BoringTravelShare/BoringTravelShare.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justdataplease.boringtravel.share
        PRODUCT_NAME: BoringTravelShare
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
        # An extension may use only the API Apple allows extensions (UIApplication.shared is not among them).
        APPLICATION_EXTENSION_API_ONLY: true
  # Opens the app in the Simulator and saves a picture of each screen, which CI uploads for review.
  BoringTravelTour:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BoringTravelTour
    dependencies:
      - target: BoringTravel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justdataplease.boringtravel.tour
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: BoringTravel
schemes:
  BoringTravel:
    build:
      targets:
        BoringTravel: all
        BoringTravelTour: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BoringTravelTour
    archive:
      config: Release
